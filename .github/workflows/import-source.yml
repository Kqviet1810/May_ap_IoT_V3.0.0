name: Import source snapshot

on:
  push:
    paths:
      - ".github/workflows/import-source.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone source branch
        run: |
          git clone --depth 1 --branch feat/google-account-multitenant \
            https://github.com/Kqviet1810/May_ap_trung_V2.1.1.git /tmp/mayap-source

      - name: Copy source tree
        run: |
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/workflows/import-source.yml' \
            /tmp/mayap-source/ ./

      - name: Commit imported snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to import."
            exit 0
          fi
          git commit -m "Import feat/google-account-multitenant snapshot"
          git push origin HEAD:main
