name: Publish manual v1.3 E503

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-manual-v1_3.yml'
      - 'tools/build_manual_append_only.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore original Rev 1.2 PDF
        run: |
          git show 1f24ac1dfb12baab19894fabbf6ecc5b959f7d10:docs/MAYAP_Huong_dan_van_hanh_A5_v1.2_E502.pdf > /tmp/MAYAP_Huong_dan_van_hanh_A5_v1.2_E502.pdf

      - name: Install append-only PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python3 -m pip install --upgrade pip
          python3 -m pip install reportlab pymupdf

      - name: Append only missing firmware fault codes
        run: python3 tools/build_manual_append_only.py

      - name: Point website to Rev 1.3 and bust stale PDF cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('MAYAP_Huong_dan_van_hanh_A5_v1.2_E502.pdf', 'MAYAP_Huong_dan_van_hanh_A5_v1.3_E503.pdf')
          s = re.sub(r'MAYAP_Huong_dan_van_hanh_A5_v1\.3_E503\.pdf(?:\?rev=[^\"\']+)?',
                     'MAYAP_Huong_dan_van_hanh_A5_v1.3_E503.pdf?rev=20260930-append3', s)
          s = s.replace('Tài liệu A5 Rev. 1.2 · 18 trang · có mã lỗi E502', 'Tài liệu A5 Rev. 1.3 · bản gốc + trang mã lỗi bổ sung · đến E503')
          s = s.replace('Tài liệu A5 Rev. 1.3 · đồng bộ firmware 4.0.0 · 41 mã lỗi · đến E503', 'Tài liệu A5 Rev. 1.3 · bản gốc + trang mã lỗi bổ sung · đến E503')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit corrected PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html docs/MAYAP_Huong_dan_van_hanh_A5_v1.3_E503.pdf
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'docs: keep original manual and append missing fault codes'
          git push
