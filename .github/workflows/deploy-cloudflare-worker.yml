name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Nhanh/tag chua ma Worker can deploy'
        required: true
        default: 'main'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ma nguon can deploy
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}

      - name: Cai Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Kiem tra secret trien khai
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Thieu CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Thieu CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Kiem tra JavaScript Worker
        run: |
          node --check cloudflare/src/reliability-wrapper.js
          node --check cloudflare/src/security-wrapper.js
          node --check cloudflare/src/index.js
          node --check cloudflare/src/auth.js
          node --check cloudflare/src/db.js
          node --check cloudflare/src/push.js
          node --check config.js

      - name: Kiem tra dong bo release
        run: python3 tools/check_release_sync.py

      - name: Kiem tra reliability truoc deploy
        run: python3 tools/check_v381_reliability.py

      - name: Cai phu thuoc Worker
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx --yes pnpm@11.19.0 install --frozen-lockfile
          node --check src/account-worker.js

      - name: Cap nhat D1 schema
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply mayap_push --remote

      - name: Trien khai Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
