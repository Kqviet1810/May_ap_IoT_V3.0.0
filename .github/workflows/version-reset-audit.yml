name: Version reset audit

on:
  push:
    paths:
      - ".github/workflows/version-reset-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Find active version references
        shell: bash
        run: |
          set -euo pipefail
          echo "=== 4.0.0 / v4_0_0 / firmware folder ==="
          grep -RInE --exclude-dir=.git --exclude-dir=build-online-hardening \
            '4\.0\.0|v4_0_0|MAYAP_INDUSTRIAL_v4_0_0' . || true
          echo "=== web 12.2.2 ==="
          grep -RInE --exclude-dir=.git --exclude-dir=build-online-hardening \
            '12\.2\.2|mayap-web-v12\.2\.2' . || true
